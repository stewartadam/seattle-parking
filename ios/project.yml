# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen generate
name: SeattleParking
options:
  bundleIdPrefix: com.github.stewartadam
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple developer team ID here, or pick the team in Xcode's
    # Signing & Capabilities tab after generating.
    DEVELOPMENT_TEAM: ""
targets:
  SeattleParking:
    type: application
    platform: iOS
    sources:
      - SeattleParking
    info:
      path: SeattleParking/Info.plist
      properties:
        CFBundleDisplayName: Seattle Parking
        # Use the build settings below instead of XcodeGen's default "1.0"/"1".
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Only standard HTTPS: skips the export-compliance question per upload.
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: >-
          Seattle Parking uses your location to look up the parking rules on
          the street you're on and the nearest places you can park.
        # The phone UI stays SwiftUI's WindowGroup; this adds the CarPlay scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.stewartadam.seattleparking
        # iPhone only, so portrait-only doesn't trip the iPad multitasking warning.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # CarPlay needs Apple's com.apple.developer.carplay-parking entitlement.
        # Simulator builds don't need a provisioning profile, so they always
        # get it. For devices, uncomment the second line once Apple grants it
        # to the team; until then signing would fail without it in the profile.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": CarPlay.entitlements
        # CODE_SIGN_ENTITLEMENTS: CarPlay.entitlements
