# Builds the iPhone app and runs its unit tests in the iOS Simulator.
# Unsigned: no Apple account or secrets needed.
name: ios
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'test/fixtures/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'test/fixtures/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          # The newest iOS runtime's first iPhone, whatever this runner image has.
          id=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("iOS")))
            | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj|tonumber), (.min|tonumber)])
            | last.value | map(select(.name | startswith("iPhone"))) | first.udid')
          echo "Using simulator $id"
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: |
          status=0
          xcodebuild test \
            -project SeattleParking.xcodeproj \
            -scheme SeattleParking \
            -destination "id=$SIMULATOR_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 || status=$?
          # The full log is long; show errors and test results, then the tail.
          grep -E 'error:|^Test Case .* (passed|failed)|^Test Suite .*(passed|failed)|^\*\* ' xcodebuild.log || true
          if [ "$status" -ne 0 ]; then tail -50 xcodebuild.log; fi
          exit "$status"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild.log
