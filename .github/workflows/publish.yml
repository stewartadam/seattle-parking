name: publish
# Builds the server image and pushes it to Docker Hub after each commit on main.
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with Read & Write scope).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'ios/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            stewartadam/seattle-parking:latest
            stewartadam/seattle-parking:${{ steps.tags.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
